<section
  class="games-carousel"
  aria-label="Videogiochi in evidenza"
  (mouseenter)="stopAutoplay()"
  (mouseleave)="startAutoplay()"
>
  <button
    class="carousel-arrow carousel-arrow--previous"
    type="button"
    aria-label="Mostra i giochi precedenti"
    (click)="scroll(-1)"
  >
    &#8249;
  </button>

  <div #cardTrack class="card-track">
    <article class="game-card" *ngFor="let game of games; let index = index">
      <button
        class="game-card__image-wrap"
        type="button"
        [attr.aria-label]="'Apri i dettagli di ' + game.title"
        (click)="openProductDialog(game)"
      >
        <img
          class="game-card__image"
          [src]="game.image"
          [alt]="'Copertina di ' + game.title"
          [attr.loading]="index < 3 ? 'eager' : 'lazy'"
          [attr.fetchpriority]="index < 3 ? 'high' : 'auto'"
          decoding="async"
          referrerpolicy="no-referrer"
        >
      </button>

      <div class="game-card__content">
        <h3>{{ game.title }} <span>({{ game.condition }})</span></h3>
        <p class="game-card__price">{{ game.price }}</p>
        <button class="game-card__cart" type="button">
          <span aria-hidden="true">&#128722;</span>
          Aggiungi al carrello
        </button>
      </div>
    </article>
  </div>

  <button
    class="carousel-arrow carousel-arrow--next"
    type="button"
    aria-label="Mostra altri giochi"
    (click)="scroll(1)"
  >
    &#8250;
  </button>
</section>

<app-product-dialog [product]="selectedGame"></app-product-dialog>
